[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xbse"
version = "0.1.0"
description = "Modular framework for domain-specific BERT Sentence Embeddings (LaBSE/LeBSE/MoBSE): shared encoder + contrastive objective + one validation gate, per-domain PairSource plugins"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrew H. Bond", email = "andrew.bond@sjsu.edu" }]
keywords = ["sentence-embeddings", "contrastive-learning", "invariance", "moral-reasoning", "geometric-ethics", "nlp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.1",
    "sentence-transformers>=2.7",
    "transformers>=4.40",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "black>=24.0", "ty>=0.0.1a1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E741",  # single-letter names (l, z) are used deliberately in the contrastive/geometry math
    "E501",  # black owns line length (100); E501 is redundant noise on long strings/comments/URLs
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
# ty is pre-1.0; unresolved third-party imports (torch/transformers) stay advisory, not fatal.
unresolved-import = "warn"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
